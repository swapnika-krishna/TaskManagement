<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Task Management Board</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div>
            <h1>Task Management Board</h1>

            <p>
                Organize and track your tasks
            </p>
        </div>

        <button id="addTaskBtn">
            + Add Task
        </button>

    </nav>


    <!-- =========================
         SEARCH AND FILTERS
    ========================== -->

    <section class="controls">

        <input
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
        >


        <select id="priorityFilter">

            <option value="all">
                All Priorities
            </option>

            <option value="High">
                High
            </option>

            <option value="Medium">
                Medium
            </option>

            <option value="Low">
                Low
            </option>

        </select>


        <select id="userFilter">

            <option value="all">
                All Users
            </option>

        </select>

    </section>


    <!-- =========================
         KANBAN BOARD
    ========================== -->

    <main class="board">


        <!-- TODO -->

        <section class="column">

            <div class="column-header">

                <h2>TODO</h2>

                <span id="todoCount">
                    0
                </span>

            </div>

            <div
                id="todoTasks"
                class="task-list"
                data-status="todo">
            </div>

        </section>


        <!-- IN PROGRESS -->

        <section class="column">

            <div class="column-header">

                <h2>IN PROGRESS</h2>

                <span id="progressCount">
                    0
                </span>

            </div>

            <div
                id="progressTasks"
                class="task-list"
                data-status="in-progress">
            </div>

        </section>


        <!-- COMPLETED -->

        <section class="column">

            <div class="column-header">

                <h2>COMPLETED</h2>

                <span id="completedCount">
                    0
                </span>

            </div>

            <div
                id="completedTasks"
                class="task-list"
                data-status="completed">
            </div>

        </section>

    </main>


    <!-- =========================
         CREATE / EDIT MODAL
    ========================== -->

    <div id="taskModal" class="modal">

        <div class="modal-content">

            <span
                id="closeModal"
                class="close">
                &times;
            </span>


            <h2 id="modalTitle">
                Create Task
            </h2>


            <form id="taskForm">


                <!-- TITLE -->

                <label for="taskTitle">
                    Task Title
                </label>

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Enter task title"
                    required
                >


                <!-- DESCRIPTION -->

                <label for="taskDescription">
                    Description
                </label>

                <textarea
                    id="taskDescription"
                    placeholder="Enter task description"
                    required
                ></textarea>


                <!-- USER -->

                <label for="taskUser">
                    Assigned To
                </label>

                <input
                    type="text"
                    id="taskUser"
                    placeholder="Enter user name"
                    required
                >


                <!-- PRIORITY -->

                <label for="taskPriority">
                    Priority
                </label>

                <select id="taskPriority">

                    <option value="High">
                        High
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="Low">
                        Low
                    </option>

                </select>


                <!-- STATUS -->

                <label for="taskStatus">
                    Status
                </label>

                <select id="taskStatus">

                    <option value="todo">
                        TODO
                    </option>

                    <option value="in-progress">
                        IN PROGRESS
                    </option>

                    <option value="completed">
                        COMPLETED
                    </option>

                </select>


                <button
                    type="submit"
                    class="save-btn">

                    Save Task

                </button>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
